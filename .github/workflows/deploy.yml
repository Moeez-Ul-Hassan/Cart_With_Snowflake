name: Enterprise API CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd Cart_With_Snowflake
            git pull origin main
            
            # Activate environment and install new dependencies
            source venv/bin/activate
            pip install -r requirements.txt
            
            # The Magic Bracket Trick: Kills the server, but spares this script!
            pkill -f "[u]vicorn" || true
            
            # Start the new server completely detached from the SSH session
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 </dev/null &
            
            # Give the server 2 seconds to fork before closing the SSH tunnel
            sleep 2