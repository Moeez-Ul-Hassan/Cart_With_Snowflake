version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enterprise_password
      POSTGRES_DB: cart_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cart.com # This is required at launch
      PGADMIN_DEFAULT_PASSWORD: admin # This is required at launch
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data: